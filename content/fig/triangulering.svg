<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170"><title>Triangulering: bagpejling fra to kendte objekter A og B skærer hinanden i din position X</title>
<g stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round">
<path d="M10 150 L270 150 L270 10 L10 10 Z" stroke-opacity=".3"/>
<path d="M50 40 L150 120" /><path d="M230 40 L150 120"/><path d="M150 120 L150 150" stroke-dasharray="4 4" stroke-opacity=".6"/>
<circle cx="150" cy="120" r="7" fill="currentColor" fill-opacity=".35"/>
<path d="M44 34 l12 0 l-6 -10 Z" fill="currentColor" fill-opacity=".4"/><path d="M224 34 l12 0 l-6 -10 Z" fill="currentColor" fill-opacity=".4"/></g>
<g font-family="system-ui,sans-serif" fill="currentColor" font-size="11"><text x="40" y="58" font-weight="700">A (kirketårn)</text><text x="196" y="58" font-weight="700">B (mast)</text><text x="160" y="132" font-weight="700">X = din position</text><text x="8" y="166" font-size="10">Pejl A og B, omregn til kortvinkel, læg bagpejling (±180°) ind på kortet</text></g></svg>
