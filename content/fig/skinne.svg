<path d="M20 60 H220 V84 H20 Z" fill="currentColor" fill-opacity=".1"/><path d="M8 52 H232 V60 H8 Z" fill="currentColor" fill-opacity=".25"/>
<path d="M62 52 v40 M110 52 v40 M158 52 v40 M200 52 v40" stroke-opacity=".7"/>
