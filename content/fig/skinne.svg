<text x="8" y="22" font-size="11" fill="currentColor" font-family="system-ui,sans-serif">Skinne rækker forbi leddet ovenfor og nedenfor skaden</text>
<text x="8" y="44" font-size="10" fill="currentColor" font-family="system-ui,sans-serif">stiv pind + polstring</text>
<text x="8" y="124" font-size="10" fill="currentColor" font-family="system-ui,sans-serif">Bind nederst først; stram ikke så blodtilførslen hæmmes · skematisk</text></svg>
