<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130"><title>Støtteskinne: stiv pind længere end lemmet, polstret, bundet fra neden og opad; ledet ovenfor og nedenfor skaden holdes i ro</title>
