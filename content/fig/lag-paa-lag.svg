<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150"><title>Lag-på-lag: fugttransporterende inderst, isolerende midt, vind- og vandtæt yderst, plus hue og tørt skiftesæt</title>
<g stroke="currentColor" stroke-width="2.5" fill="none">
<rect x="10" y="20" width="70" height="90" rx="10" fill="currentColor" fill-opacity=".08"/><rect x="95" y="20" width="70" height="90" rx="10" fill="currentColor" fill-opacity=".16"/><rect x="180" y="20" width="70" height="90" rx="10" fill="currentColor" fill-opacity=".26"/></g>
<g font-family="system-ui,sans-serif" fill="currentColor"><text x="45" y="14" font-size="12" font-weight="700" text-anchor="middle">1 Basis</text><text x="130" y="14" font-size="12" font-weight="700" text-anchor="middle">2 Isolering</text><text x="215" y="14" font-size="12" font-weight="700" text-anchor="middle">3 Skal</text>
<text x="45" y="62" font-size="10" text-anchor="middle">uld/syntetisk</text><text x="45" y="76" font-size="10" text-anchor="middle">transporterer fugt</text>
<text x="130" y="62" font-size="10" text-anchor="middle">fleece/uld/dun</text><text x="130" y="76" font-size="10" text-anchor="middle">fanger luft</text>
<text x="215" y="62" font-size="10" text-anchor="middle">vindtæt</text><text x="215" y="76" font-size="10" text-anchor="middle">regn-/vandtæt</text>
<text x="8" y="136" font-size="10">Altid: hue, handsker, tørre strømper og et tørt skiftesæt i vandtæt pose</text></g></svg>
